workflows:
  ios-testflight:
    name: NAYSA Sport iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nasa.sport
      groups:
        - app_store_connect
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true