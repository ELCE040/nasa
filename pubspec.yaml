name: nasa_sport
description: "Nasa Sport — Malawi grassroots & youth football, by ward, for viewers, scouts and teams."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  image_cropper: ^9.1.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  palette_generator: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"
